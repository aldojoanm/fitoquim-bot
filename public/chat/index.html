<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <meta
    name="theme-color"
    content="#0b5da6"
  />
  <title>FITOQUIM</title>
  <link
    rel="stylesheet"
    href="/chat/chat.css"
  />
</head>
<body>
  <main class="chat">
    <header class="cabecera">
      <div class="marca">
        <div class="marca-icono">
          F
        </div>

        <div class="marca-textos">
          <strong>FITOQUIM</strong>

          <div class="estado">
            <span
              class="estado-punto"
            ></span>
            <span>En línea</span>
          </div>
        </div>
      </div>
    </header>

    <section
      id="mensajes"
      class="mensajes"
      aria-live="polite"
    ></section>

    <footer class="pie">
      <button
        id="volver-menu"
        class="volver-menu"
        type="button"
      >
        <span>↩</span>
        Volver al menú
      </button>

      <form
        id="formulario"
        class="formulario"
      >
        <input
          id="entrada"
          type="text"
          maxlength="1000"
          autocomplete="off"
          placeholder="Escriba su consulta..."
        />

        <button
          id="enviar"
          type="submit"
          aria-label="Enviar"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M3.4 20.4 21.1 12 3.4 3.6l.1 6.5 12.2 1.9-12.2 1.9-.1 6.5Z"
            />
          </svg>
        </button>
      </form>
    </footer>
  </main>

  <script
    src="/chat/chat.js"
    defer
  ></script>
</body>
</html>
